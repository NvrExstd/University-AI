name: test_project

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    image: nginx:latest
    volumes:
      - ./html:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
