<!-- resource.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Личный кабинет</title>
<style>
  body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #f0f0f0;
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    background-color: #2f4f7f;
    padding: 30px 40px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 {
    margin-bottom: 25px;
    font-weight: 700;
    font-size: 1.8rem;
  }
  .welcome {
    font-size: 1.3rem;
    margin-bottom: 40px;
  }
  a.logout-link {
    display: inline-block;
    padding: 10px 25px;
    background: linear-gradient(90deg, #e74c3c, #c0392b);
    color: #fff;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 700;
    box-shadow: 0 5px 15px rgba(192,57,43,0.8);
    transition: background 0.3s ease;
  }
  a.logout-link:hover {
    background: linear-gradient(90deg, #c0392b, #992d22);
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Личный кабинет</h1>
    <div class="welcome">Добро пожаловать, {{ username }}!</div>
    <a href="{{ url_for('change_password') }}" class="logout-link" style="margin-right:15px;">Сменить пароль</a>
    <a href="{{ url_for('logout') }}" class="logout-link">Выйти</a>
  </div>
</body>
</html>
